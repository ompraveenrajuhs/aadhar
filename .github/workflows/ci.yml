name: CI

on:
  push:
    branches: ["auto-tests", "main"]
  pull_request:
    branches: ["auto-tests", "main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure Maven is available
        run: python scripts/ensure_maven.py --version 3.9.9 --install-dir .tools/maven

      - name: Verify (tests + JaCoCo check)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

