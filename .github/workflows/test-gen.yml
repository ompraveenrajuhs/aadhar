name: Generate Tests

on:
  push:
    branches-ignore:
      - auto-tests
    paths:
      - "src/main/java/**/*.java"
      - "pom.xml"
      - "scripts/**/*.py"
      - ".github/workflows/test-gen.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    runs-on: [self-hosted]
    if: github.actor != 'github-actions[bot]'
    defaults:
      run:
        shell: powershell
    env:
      OLLAMA_MODEL: phi3
      OLLAMA_EXE: ${{ vars.OLLAMA_EXE }}
      OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
      # Use the custom truststore created on the runner host.
      MAVEN_OPTS: >-
        -Djavax.net.ssl.trustStore=C:\certs\maven-cacerts
        -Djavax.net.ssl.trustStorePassword=changeit
      GIT_SSL_NO_VERIFY: "true"
      GIT_HTTP_SSL_VERIFY: "false"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize PATH for tool resolution
        shell: powershell
        run: |
          $segments = $env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notmatch '(?i)windowsapps\\python\.exe')
          }
          $clean = ($segments | Select-Object -Unique) -join ';'
          "PATH=$clean" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure Maven is available
        run: python scripts/ensure_maven.py --version 3.9.9 --install-dir .tools/maven

      - name: Fetch auto-tests base ref
        run: git fetch origin auto-tests:refs/remotes/origin/auto-tests

      - name: Find changed classes and transitive dependents
        run: python scripts/find_test_targets.py --base-ref origin/auto-tests --output .tmp/test-targets.txt

      - name: Check whether there are generation targets
        id: target_check
        run: python scripts/test_gen_precheck.py check-targets --targets .tmp/test-targets.txt

      - name: Pull Ollama model
        if: steps.target_check.outputs.has_targets == 'true'
        run: python scripts/pull_ollama_model.py --model ${{ env.OLLAMA_MODEL }}

      # ── Round 1: generate / augment tests ───────────────────────────────
      - name: Generate tests (round 1)
        if: steps.target_check.outputs.has_targets == 'true'
        run: python scripts/generate_tests_with_ollama.py --targets .tmp/test-targets.txt --model ${{ env.OLLAMA_MODEL }}

      - name: Auto-fix compile errors (round 1)
        if: steps.target_check.outputs.has_targets == 'true'
        run: python scripts/fix_generated_tests.py --targets .tmp/test-targets.txt --model ${{ env.OLLAMA_MODEL }}

      - name: Run tests + JaCoCo (round 1)
        id: test_r1
        if: steps.target_check.outputs.has_targets == 'true'
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Check coverage (round 1)
        id: cov_r1
        if: steps.target_check.outputs.has_targets == 'true' && steps.test_r1.outcome == 'success'
        continue-on-error: true
        run: python scripts/check_coverage.py --report target/site/jacoco/jacoco.xml --threshold 80

      # ── Round 2: generate more tests when coverage < 80 % ───────────────
      - name: Generate tests (round 2 – coverage boost)
        if: >
          steps.target_check.outputs.has_targets == 'true' &&
          steps.test_r1.outcome == 'success' &&
          steps.cov_r1.outputs.coverage_ok == 'false'
        run: |
          python scripts/generate_tests_with_ollama.py `
            --targets .tmp/test-targets.txt `
            --model ${{ env.OLLAMA_MODEL }} `
            --extra-instruction "Current coverage is ${{ steps.cov_r1.outputs.coverage_pct }}%. Write tests that cover uncovered branches and edge cases to push coverage above 80%."

      - name: Auto-fix compile errors (round 2)
        if: >
          steps.target_check.outputs.has_targets == 'true' &&
          steps.test_r1.outcome == 'success' &&
          steps.cov_r1.outputs.coverage_ok == 'false'
        run: python scripts/fix_generated_tests.py --targets .tmp/test-targets.txt --model ${{ env.OLLAMA_MODEL }}

      - name: Run tests + JaCoCo (round 2)
        id: test_r2
        if: >
          steps.target_check.outputs.has_targets == 'true' &&
          steps.test_r1.outcome == 'success' &&
          steps.cov_r1.outputs.coverage_ok == 'false'
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Check coverage (round 2)
        id: cov_r2
        if: >
          steps.target_check.outputs.has_targets == 'true' &&
          steps.test_r1.outcome == 'success' &&
          steps.cov_r1.outputs.coverage_ok == 'false' &&
          steps.test_r2.outcome == 'success'
        continue-on-error: true
        run: python scripts/check_coverage.py --report target/site/jacoco/jacoco.xml --threshold 80

      # ── Fail job when tests never passed ────────────────────────────────
      - name: Fail if both test rounds failed
        if: >
          steps.target_check.outputs.has_targets == 'true' &&
          steps.test_r1.outcome == 'failure' &&
          (steps.test_r2.outcome == 'failure' || steps.test_r2.outcome == '')
        run: exit 1

      # ── Create PR to auto-tests ──────────────────────────────────────────
      - name: Create or update PR to auto-tests
        if: >
          steps.target_check.outputs.has_targets == 'true' &&
          (steps.test_r1.outcome == 'success' || steps.test_r2.outcome == 'success')
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          GIT_SSL_NO_VERIFY: "true"
          GIT_HTTP_SSL_VERIFY: "false"
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/generated-tests
          base: auto-tests
          title: "chore(tests): AI-generated unit tests"
          body: |
            Auto-generated tests appended into existing `*Test.java` files.
            - Model: ${{ env.OLLAMA_MODEL }}
            - Coverage round 1: ${{ steps.cov_r1.outputs.coverage_pct }}%
            - Coverage round 2: ${{ steps.cov_r2.outputs.coverage_pct }}%
            - Target branch: `auto-tests`

            Reviewer approval required before merge.
          commit-message: "chore(tests): augment tests for coverage >= 80%"
          labels: |
            automated-tests
            needs-review

