name: Generate Tests

on:
  push:
    branches-ignore:
      - auto-tests
    paths:
      - "src/main/java/**/*.java"
      - "pom.xml"
      - "scripts/**/*.py"
      - ".github/workflows/test-gen.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    # Defaults to self-hosted runner labels; extend if you add a dedicated label.
    # Trigger note: touching this workflow file is used for controlled reruns during CI debugging.
    runs-on: [self-hosted]
    if: github.actor != 'github-actions[bot]'
    env:
      OLLAMA_MODEL: phi3
      OLLAMA_EXE: ${{ vars.OLLAMA_EXE }}
      OLLAMA_HOST: ${{ vars.OLLAMA_HOST }}
      GIT_SSL_NO_VERIFY: "true"
      GIT_HTTP_SSL_VERIFY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize PATH for tool resolution
        shell: pwsh
        run: |
          $bad = 'C:\Users\PraveenRajuHS\AppData\Local\Microsoft\WindowsApps\python.exe'
          $clean = ($env:PATH -split ';' | Where-Object { $_ -and $_ -ne $bad }) -join ';'
          "PATH=$clean" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure Maven is available
        run: python scripts/ensure_maven.py --version 3.9.9 --install-dir .tools/maven

      - name: Fetch auto-tests base ref
        run: git fetch origin auto-tests:refs/remotes/origin/auto-tests

      - name: Find changed classes and transitive dependents
        run: python scripts/find_test_targets.py --base-ref origin/auto-tests --output .tmp/test-targets.txt

      - name: Check whether there are generation targets
        id: target_check
        run: python scripts/test_gen_precheck.py check-targets --targets .tmp/test-targets.txt

      - name: Pull Ollama model
        if: steps.target_check.outputs.has_targets == 'true'
        run: python scripts/pull_ollama_model.py --model ${{ env.OLLAMA_MODEL }}

      - name: Generate tests with Ollama
        if: steps.target_check.outputs.has_targets == 'true'
        run: python scripts/generate_tests_with_ollama.py --targets .tmp/test-targets.txt --model ${{ env.OLLAMA_MODEL }}

      - name: Run unit tests after generation (attempt 1)
        id: test_attempt
        if: steps.target_check.outputs.has_targets == 'true'
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress test

      - name: Auto-fix generated tests when build fails
        if: steps.target_check.outputs.has_targets == 'true' && steps.test_attempt.outcome == 'failure'
        run: python scripts/fix_generated_tests.py --targets .tmp/test-targets.txt --model ${{ env.OLLAMA_MODEL }}

      - name: Run unit tests after generation (attempt 2)
        id: test_retry
        if: steps.target_check.outputs.has_targets == 'true' && steps.test_attempt.outcome == 'failure'
        continue-on-error: true
        run: mvn --batch-mode --no-transfer-progress test

      - name: Fail when tests still fail after auto-fix
        if: steps.target_check.outputs.has_targets == 'true' && steps.test_attempt.outcome == 'failure' && steps.test_retry.outcome == 'failure'
        run: exit 1

      - name: Create or update PR to auto-tests
        if: steps.target_check.outputs.has_targets == 'true' && (steps.test_attempt.outcome == 'success' || steps.test_retry.outcome == 'success')
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/generated-tests
          base: auto-tests
          title: "chore(tests): AI-generated unit tests"
          body: |
            This PR contains tests generated by the Ollama workflow.
            - Scope: changed files and transitive dependents
            - Model: ${{ env.OLLAMA_MODEL }}
            - Target branch: auto-tests

            Reviewer approval is required before merge.
          commit-message: "chore(tests): add AI-generated tests"
          labels: |
            automated-tests
            needs-review

