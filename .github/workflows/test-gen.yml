name: Generate Tests

on:
  push:
    branches-ignore:
      - auto-tests
    paths:
      - "src/main/java/**/*.java"
      - "pom.xml"
      - "scripts/**/*.py"
      - ".github/workflows/test-gen.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-tests:
    # Defaults to self-hosted runner labels; extend if you add a dedicated label.
    runs-on: [self-hosted]
    if: github.actor != 'github-actions[bot]'
    env:
      OLLAMA_MODEL: llama3.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure auto-tests branch exists remotely
        shell: pwsh
        run: |
          git ls-remote --exit-code --heads origin auto-tests | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Branch auto-tests does not exist on remote."
          }

      - name: Find changed classes and transitive dependents
        run: python scripts/find_test_targets.py --base-ref origin/auto-tests --output .tmp/test-targets.txt

      - name: Check whether there are generation targets
        id: target_check
        shell: pwsh
        run: |
          if (Test-Path '.tmp/test-targets.txt' -PathType Leaf -and (Get-Item '.tmp/test-targets.txt').Length -gt 0) {
            "has_targets=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "has_targets=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No Java targets found. Skipping generation and PR update."
          }

      - name: Generate tests with Ollama
        if: steps.target_check.outputs.has_targets == 'true'
        run: python scripts/generate_tests_with_ollama.py --targets .tmp/test-targets.txt --model ${{ env.OLLAMA_MODEL }}

      - name: Run unit tests after generation
        if: steps.target_check.outputs.has_targets == 'true'
        run: mvn --batch-mode --no-transfer-progress test

      - name: Create or update PR to auto-tests
        if: steps.target_check.outputs.has_targets == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/generated-tests
          base: auto-tests
          title: "chore(tests): AI-generated unit tests"
          body: |
            This PR contains tests generated by the Ollama workflow.
            - Scope: changed files and transitive dependents
            - Model: ${{ env.OLLAMA_MODEL }}
            - Target branch: auto-tests

            Reviewer approval is required before merge.
          commit-message: "chore(tests): add AI-generated tests"
          labels: |
            automated-tests
            needs-review

